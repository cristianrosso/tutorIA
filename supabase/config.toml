# Instancia exclusiva del tutor. No usar IDs ni puertos de otros proyectos.
# https://supabase.com/docs/guides/local-development/cli/config
project_id = "tutor-ia-fatescipol"

[api]
enabled = true
port = 56431
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[api.tls]
enabled = false

[db]
port = 56432
shadow_port = 56430
health_timeout = "2m"
major_version = 17

[db.pooler]
enabled = false
port = 56439
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = false

[studio]
enabled = true
port = 56433
api_url = "http://127.0.0.1"

[local_smtp]
enabled = false
port = 56434
smtp_port = 56435
pop3_port = 56436

[storage]
enabled = false
file_size_limit = "50MiB"

[storage.s3_protocol]
enabled = false

[storage.analytics]
enabled = false

[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3010"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 12
password_requirements = ""

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false

[edge_runtime]
enabled = false
inspector_port = 56438

[analytics]
enabled = false
port = 56437
backend = "postgres"
